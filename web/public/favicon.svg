<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Sun rays -->
  <g stroke="#10b981" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="4" x2="32" y2="12"/>
    <line x1="18" y1="8" x2="22" y2="14"/>
    <line x1="46" y1="8" x2="42" y2="14"/>
    <line x1="10" y1="18" x2="16" y2="20"/>
    <line x1="54" y1="18" x2="48" y2="20"/>
  </g>
  
  <!-- Sun body -->
  <circle cx="32" cy="22" r="10" fill="#10b981"/>
  
  <!-- Lightning bolt -->
  <path d="M35 18 L28 30 L34 30 L29 42 L40 26 L33 26 L38 18 Z" fill="#059669"/>
  
  <!-- Network hexagon -->
  <polygon points="32,16 48,24 48,40 32,48 16,40 16,24" stroke="#10b981" stroke-width="2" fill="none"/>
  
  <!-- Network nodes -->
  <circle cx="32" cy="16" r="3" fill="#10b981"/>
  <circle cx="48" cy="24" r="3" fill="#10b981"/>
  <circle cx="48" cy="40" r="3" fill="#10b981"/>
  <circle cx="32" cy="48" r="3" fill="#10b981"/>
  <circle cx="16" cy="40" r="3" fill="#10b981"/>
  <circle cx="16" cy="24" r="3" fill="#10b981"/>
  
  <!-- Left house -->
  <rect x="4" y="32" width="10" height="8" rx="1" fill="#059669"/>
  <polygon points="4,32 9,27 14,32" fill="#10b981"/>
  <rect x="6" y="34" width="3" height="3" rx="0.5" fill="#d1fae5"/>
  <line x1="5" y1="30" x2="7" y2="28" stroke="#10b981" stroke-width="1"/>
  <line x1="7" y1="30" x2="9" y2="28" stroke="#10b981" stroke-width="1"/>
  <line x1="9" y1="30" x2="11" y2="28" stroke="#10b981" stroke-width="1"/>
  
  <!-- Right house -->
  <rect x="50" y="32" width="10" height="8" rx="1" fill="#059669"/>
  <polygon points="50,32 55,27 60,32" fill="#10b981"/>
  <rect x="52" y="34" width="3" height="3" rx="0.5" fill="#d1fae5"/>
  <line x1="51" y1="30" x2="53" y2="28" stroke="#10b981" stroke-width="1"/>
  <line x1="53" y1="30" x2="55" y2="28" stroke="#10b981" stroke-width="1"/>
  <line x1="55" y1="30" x2="57" y2="28" stroke="#10b981" stroke-width="1"/>
  
  <!-- Battery -->
  <rect x="24" y="52" width="16" height="8" rx="2" stroke="#10b981" stroke-width="2" fill="none"/>
  <rect x="40" y="54" width="3" height="4" rx="1" fill="#10b981"/>
  <rect x="27" y="55" width="4" height="3" rx="0.5" fill="#10b981"/>
  <rect x="32" y="55" width="4" height="3" rx="0.5" fill="#10b981"/>
  <rect x="37" y="55" width="1" height="3" rx="0.5" fill="#10b981"/>
</svg>
